name: Build macOS Package

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Loquacio.slnx

      - name: Publish binaries for macOS
        run: |
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          SHORT_HASH="$(git rev-parse --short HEAD)"
          NUGET_VERSION="${BASE#v}+${SHORT_HASH}"

          dotnet publish Loquacio.Daemon/Loquacio.Daemon.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=false -p:Version="$NUGET_VERSION" \
            -o dist/publish/osx-x64

          dotnet publish Loquacio.Avalonia/Loquacio.Avalonia.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=false -p:Version="$NUGET_VERSION" \
            -o dist/publish/osx-x64

          dotnet publish Loquacio.Tui/Loquacio.Tui.csproj \
            -c Release -r osx-x64 --self-contained true \
            -p:PublishSingleFile=false -p:Version="$NUGET_VERSION" \
            -o dist/publish/osx-x64

      - name: Build .app bundle
        run: packaging/macos/build-app.sh --skip-build

      - name: Run tests
        run: dotnet test Loquacio.Tests/Loquacio.Tests.csproj --no-restore --configuration Release

      - name: Upload .app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: loquacio-macos-app
          path: dist/*.app

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r ../loquacio-macos.zip Loquacio.app

      - name: Upload ZIP artifact (for release)
        uses: actions/upload-artifact@v4
        with:
          name: loquacio-macos-zip
          path: loquacio-macos.zip

      - name: Publish draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Same version scheme the build uses: base version comes from the
          # latest v* tag, so bumping the tag is what "increments" the version.
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          VERSION="${BASE#v}"
          ZIP="Loquacio-${VERSION}-macos.zip"
          mv loquacio-macos.zip "$ZIP"

          REPO="${{ github.repository }}"
          # Find an existing DRAFT release for this version (ignore published
          # releases and drafts of other versions).
          DRAFT_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$BASE\") | .id" | head -1 || true)"

          PUBLISHED_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select((.draft | not) and .tag_name == \"$BASE\") | .id" | head -1 || true)"

          if [ -n "$DRAFT_ID" ]; then
            echo "Version $VERSION unchanged — overwriting existing draft release"
            # Replace all assets so the draft always reflects the latest build.
            for ASSET_ID in $(gh api "repos/$REPO/releases/$DRAFT_ID/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID"
            done
            UPLOAD_URL="$(gh api "repos/$REPO/releases/$DRAFT_ID" --jq '.upload_url' | sed 's/{.*}//')"
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$ZIP" \
              "$UPLOAD_URL?name=$ZIP"
          elif [ -n "$PUBLISHED_ID" ]; then
            echo "Version $VERSION already published as a release — skipping draft publish"
          else
            echo "Version $VERSION is new — creating draft release"
            gh release create "$BASE" "$ZIP" \
              --draft \
              --title "Loquacio $VERSION" \
              --generate-notes
          fi
