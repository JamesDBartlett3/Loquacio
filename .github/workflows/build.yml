name: Build Packages

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Loquacio.slnx

      - name: Publish binaries
        run: |
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)"
          SHORT_HASH="$(git rev-parse --short HEAD)"
          NUGET_VERSION="${BASE#v}+${SHORT_HASH}"
          RID="${{ matrix.rid }}"

          # UI availability: WPF on Windows only, Avalonia on Linux only,
          # TUI on all three OSes. The daemon ships everywhere.
          UI_PROJECTS=""
          case "$RUNNER_OS" in
            macOS)   UI_PROJECTS="Loquacio.Tui/Loquacio.Tui.csproj" ;;
            Linux)   UI_PROJECTS="Loquacio.Avalonia/Loquacio.Avalonia.csproj Loquacio.Tui/Loquacio.Tui.csproj" ;;
            Windows) UI_PROJECTS="Loquacio/Loquacio.csproj Loquacio.Tui/Loquacio.Tui.csproj" ;;
          esac

          dotnet publish Loquacio.Daemon/Loquacio.Daemon.csproj \
            -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=false -p:Version="$NUGET_VERSION" \
            -o "dist/publish/$RID"

          for PROJECT in $UI_PROJECTS; do
            dotnet publish "$PROJECT" \
              -c Release -r "$RID" --self-contained true \
              -p:PublishSingleFile=false -p:Version="$NUGET_VERSION" \
              -o "dist/publish/$RID"
          done

      - name: Build .app bundle
        if: runner.os == 'macOS'
        run: packaging/macos/build-app.sh --skip-build

      - name: Run tests
        run: dotnet test Loquacio.Tests/Loquacio.Tests.csproj --no-restore --configuration Release

      - name: Compute version
        run: |
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          echo "VERSION=${BASE#v}" >> "$GITHUB_ENV"

      - name: Create ZIP archive
        run: |
          ZIP="Loquacio-${VERSION}-${{ matrix.rid }}.zip"
          if [ "$RUNNER_OS" = "macOS" ]; then
            (cd dist && zip -rq "$GITHUB_WORKSPACE/$ZIP" Loquacio.app)
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash has no zip. bsdtar's -a streaming zip uses data
            # descriptors, which Windows Explorer's zip handler rejects as
            # invalid -- build with PowerShell's Compress-Archive instead.
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/publish/${{ matrix.rid }}/*' -DestinationPath (Join-Path \$env:GITHUB_WORKSPACE '${ZIP}') -Force"
          else
            (cd "dist/publish/${{ matrix.rid }}" && zip -rq "$GITHUB_WORKSPACE/$ZIP" .)
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.rid }}
          path: Loquacio-*.zip

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: assets

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Same version scheme the build uses: base version comes from the
          # latest v* tag, so bumping the tag is what "increments" the version.
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          VERSION="${BASE#v}"

          REPO="${{ github.repository }}"
          # Find an existing DRAFT release for this version (ignore published
          # releases and drafts of other versions).
          DRAFT_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$BASE\") | .id" | head -1 || true)"

          PUBLISHED_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select((.draft | not) and .tag_name == \"$BASE\") | .id" | head -1 || true)"

          if [ -n "$DRAFT_ID" ]; then
            echo "Version $VERSION unchanged — overwriting existing draft release"
            # Replace all assets so the draft always reflects the latest build.
            for ASSET_ID in $(gh api "repos/$REPO/releases/$DRAFT_ID/assets" --jq '.[].id'); do
              gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID"
            done
            UPLOAD_URL="$(gh api "repos/$REPO/releases/$DRAFT_ID" --jq '.upload_url' | sed 's/{.*}//')"
            for ZIP in assets/*.zip; do
              NAME="$(basename "$ZIP")"
              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/zip" \
                --data-binary @"$ZIP" \
                "$UPLOAD_URL?name=$NAME"
            done
          elif [ -n "$PUBLISHED_ID" ]; then
            echo "Version $VERSION already published as a release — skipping draft publish"
          else
            echo "Version $VERSION is new — creating draft release"
            gh release create "$BASE" assets/*.zip \
              --draft \
              --title "Loquacio $VERSION" \
              --generate-notes
          fi
